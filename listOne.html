<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Search Book | Shareef</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><div class="brand">📚 Shareef</div><nav><a href="index.html">Home</a><a href="list.html">All Books</a><a class="active" href="listOne.html">Search Book</a><a href="insert.html">Add Book</a><a href="update.html">Update Book</a><a href="delete.html">Delete Book</a></nav></header>
<main class="page"><div class="page-heading"><span class="eyebrow">QUICK LOOKUP</span><h1>Search for a book</h1><p>Enter a book ID to view its details.</p></div>
<section class="panel form-panel"><form id="searchForm"><label>Book ID<input id="book_id" type="number" min="1" placeholder="Enter book ID" required></label><button class="btn primary" type="submit">Search book</button></form><p id="message" class="message"></p>
<div class="table-wrap"><table><thead><tr><th>Book ID</th><th>Title</th><th>Author</th><th>Category</th><th>Price (₹)</th><th>Stock</th></tr></thead><tbody id="bookRows"><tr><td colspan="6">Search for a book to see its details.</td></tr></tbody></table></div></section></main>
<script>
document.getElementById("searchForm").addEventListener("submit",async e=>{
 e.preventDefault();const id=document.getElementById("book_id").value,rows=document.getElementById("bookRows"),msg=document.getElementById("message");
 try{
  const r=await fetch("/books/"+encodeURIComponent(id));if(!r.ok)throw new Error(r.status===404?"Book not found.":"Request failed: "+r.status);
  const data=await r.json(),book=Array.isArray(data)?data[0]:data;
  if(!book)throw new Error("Book not found.");
  rows.innerHTML="";const tr=document.createElement("tr");
  ["book_id","title","author","category","price","stock"].forEach(k=>{const td=document.createElement("td");td.textContent=book[k]??"";tr.appendChild(td);});rows.appendChild(tr);
  msg.textContent="Book found.";msg.className="message success";
 }catch(err){rows.innerHTML='<tr><td colspan="6">No book details to display.</td></tr>';msg.textContent=err.message+" If the API is unavailable, check your backend.";msg.className="message error";}
});
</script></body></html>
